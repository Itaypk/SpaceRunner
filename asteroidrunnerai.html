<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asteroid Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
            margin: 0;
            overflow-x: hidden;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        #game-canvas {
            background-color: #020617; /* slate-950 */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }

        /* Custom Scrollbar for logs */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row p-4 gap-6 items-start justify-center max-w-[1400px] mx-auto">

    <!-- Game Container (Left) -->
    <div class="relative flex-shrink-0 flex flex-col items-center w-full md:w-auto">
        <div class="relative w-full max-w-[600px] aspect-[3/4] rounded-xl overflow-hidden border-2 border-slate-700">
            <!-- Canvas is logically 600x800, scales via CSS -->
            <canvas id="game-canvas" width="600" height="800" class="w-full h-full block"></canvas>
            
            <!-- Game Over / Start Overlay -->
            <div id="overlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center backdrop-blur-sm transition-opacity duration-300">
                <h1 id="overlay-title" class="text-4xl md:text-5xl font-extrabold text-white mb-4 tracking-wider uppercase text-center">Asteroid Runner</h1>
                <p id="overlay-subtitle" class="text-slate-300 mb-8 text-center max-w-sm">Dodge Metal, Shoot Stone & Ice.</p>
                <div class="flex gap-4">
                    <button onclick="startGame()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-[0_0_15px_rgba(79,70,229,0.5)] transition-all transform hover:scale-105">
                        Start Game
                    </button>
                </div>
            </div>
        </div>

        <!-- Manual Controls Hint -->
        <div class="mt-4 text-sm text-slate-400 bg-slate-800/50 p-3 rounded-lg border border-slate-700 text-center w-full max-w-[600px]">
            <span class="font-semibold text-slate-200">Manual Controls:</span> [⬅️] [➡️] to Move, [SPACE] to Shoot.
        </div>
    </div>

    <!-- AI & Settings Panel (Right) -->
    <div class="w-full md:w-[450px] flex-shrink-0 flex flex-col gap-4 max-h-[850px]">
        
        <!-- Controls Header -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
            <h2 class="text-xl font-bold text-white mb-4">Game Mode</h2>
            
            <div class="flex bg-slate-900 rounded-lg p-1 border border-slate-700 mb-4">
                <button id="btn-manual" onclick="setMode('manual')" class="flex-1 py-2 text-sm font-semibold rounded-md transition-colors bg-indigo-600 text-white shadow">Manual</button>
                <button id="btn-ai" onclick="setMode('ai')" class="flex-1 py-2 text-sm font-semibold rounded-md transition-colors text-slate-400 hover:text-white">Ollama AI</button>
            </div>

            <div id="ai-settings" class="hidden flex-col gap-3">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Ollama Model Name (Local)</label>
                <input type="text" id="ollama-model" value="llama3.2" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                
                <div id="fallback-warning" class="hidden items-start gap-2 bg-amber-900/30 border border-amber-700/50 text-amber-200 p-3 rounded-lg text-xs">
                    <svg class="w-5 h-5 text-amber-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span>CORS/Connection error. Using local Heuristic Mock AI to continue gameplay.</span>
                </div>
            </div>
        </div>

        <!-- State Viewer -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg flex-1 flex flex-col min-h-0">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wide">Extracted State JSON</h2>
                <span id="tick-counter" class="text-xs font-mono bg-slate-700 px-2 py-1 rounded text-slate-300">Tick: 0</span>
            </div>
            <pre id="state-json" class="flex-1 overflow-y-auto bg-slate-950 p-3 rounded-lg border border-slate-700 text-xs code-font text-emerald-400 shadow-inner">{}</pre>
        </div>

        <!-- Action Log -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg h-[250px] flex flex-col min-h-0">
            <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wide mb-2">Action Log</h2>
            <div id="action-log" class="flex-1 overflow-y-auto bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs code-font flex flex-col gap-1">
                <div class="text-slate-500 italic">Game log will appear here...</div>
            </div>
        </div>

    </div>

    <script>
        /**
         * AI Asteroid Runner Game Logic
         * Single-file implementation using Canvas API.
         */

        // --- Core Configurations ---
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 800;
        const LANES = 4;
        const LANE_WIDTH = CANVAS_WIDTH / LANES;
        const PLAYER_Y = 650;
        
        // Entity configurations
        const ASTEROID_SPEED = 30; // pixels per tick
        const LASER_SPEED = 80;    // pixels per tick
        
        // --- Game State Variables ---
        let mode = 'manual'; // 'manual' or 'ai'
        let gameState = 'menu'; // 'menu', 'playing', 'gameover'
        let gameId = 0; // To track current game session and abort async loops
        
        let player = { lane: 1, drawX: 0 };
        let asteroids = [];
        let lasers = [];
        let score = 0;
        let tickCount = 0;

        // Visuals (Continuous animation independent of logic ticks)
        let stars = [];
        let lastTime = 0;
        
        // Controls / Inputs
        let pendingManualAction = 'IDLE';
        let manualTickInterval = null;

        // DOM Elements
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const stateJsonEl = document.getElementById('state-json');
        const actionLogEl = document.getElementById('action-log');
        const tickCounterEl = document.getElementById('tick-counter');
        const fallbackWarning = document.getElementById('fallback-warning');

        // --- Initialization & Visuals ---
        
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * CANVAS_WIDTH,
                    y: Math.random() * CANVAS_HEIGHT,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 3 + 1
                });
            }
        }

        // Setup Event Listeners
        window.addEventListener('keydown', (e) => {
            if (gameState !== 'playing' || mode !== 'manual') return;
            if (e.key === 'ArrowLeft') {
                pendingManualAction = 'LEFT';
                e.preventDefault();
            } else if (e.key === 'ArrowRight') {
                pendingManualAction = 'RIGHT';
                e.preventDefault();
            } else if (e.key === ' ') {
                pendingManualAction = 'SHOOT';
                e.preventDefault();
            }
        });

        // Toggle UI modes
        function setMode(newMode) {
            mode = newMode;
            document.getElementById('btn-manual').className = `flex-1 py-2 text-sm font-semibold rounded-md transition-colors ${mode === 'manual' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`;
            document.getElementById('btn-ai').className = `flex-1 py-2 text-sm font-semibold rounded-md transition-colors ${mode === 'ai' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`;
            
            const aiSettings = document.getElementById('ai-settings');
            if(mode === 'ai') {
                aiSettings.classList.remove('hidden');
                aiSettings.classList.add('flex');
            } else {
                aiSettings.classList.add('hidden');
                aiSettings.classList.remove('flex');
            }

            // Restart game automatically when switching modes to clear state cleanly
            if (gameState === 'playing') {
                startGame();
            }
        }

        // --- Core Game Loop (Logic Ticks) ---

        function startGame() {
            gameState = 'playing';
            gameId++; // Invalidates previous async loops
            score = 0;
            tickCount = 0;
            asteroids = [];
            lasers = [];
            player.lane = 1;
            player.drawX = player.lane * LANE_WIDTH + (LANE_WIDTH/2);
            fallbackWarning.classList.add('hidden');
            
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300); // Wait for transition
            
            logAction('System', 'Game Started', 'text-indigo-400');
            
            if (mode === 'manual') {
                if (manualTickInterval) clearInterval(manualTickInterval);
                // In manual, logic ticks every 200ms
                manualTickInterval = setInterval(() => advanceGameStep(gameId), 200);
            } else {
                // Kick off the AI async loop
                runAILoop(gameId);
            }
        }

        function gameOver() {
            gameState = 'gameover';
            if (manualTickInterval) clearInterval(manualTickInterval);
            
            overlay.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            
            overlayTitle.innerText = "GAME OVER";
            overlaySubtitle.innerText = `Final Score: ${score} Ticks`;
            logAction('System', 'Game Over', 'text-red-500 font-bold');
        }

        // The discrete step function
        function advanceGameStep(currentGameId) {
            if (gameState !== 'playing' || currentGameId !== gameId) return;

            tickCount++;
            tickCounterEl.innerText = `Tick: ${tickCount}`;
            score++;

            let actionToApply = 'IDLE';

            if (mode === 'manual') {
                actionToApply = pendingManualAction;
                pendingManualAction = 'IDLE'; // Reset after consumption
            } 
            // In AI mode, the action is passed in as a parameter (handled in runAILoop)
            
            return executeLogic(actionToApply);
        }

        function executeLogic(action) {
            // 1. Apply Action
            if (action === 'LEFT') {
                player.lane = Math.max(0, player.lane - 1);
            } else if (action === 'RIGHT') {
                player.lane = Math.min(LANES - 1, player.lane + 1);
            } else if (action === 'SHOOT') {
                lasers.push({
                    lane: player.lane,
                    y: PLAYER_Y - 40,
                    drawY: PLAYER_Y - 40,
                    active: true
                });
            }

            // 2. Move Entities
            // Move lasers UP
            for (let l of lasers) {
                l.y -= LASER_SPEED;
            }
            
            // Move asteroids DOWN
            for (let a of asteroids) {
                a.y += ASTEROID_SPEED;
            }

            // 3. Spawner Logic
            // Spawn probability increases slightly over time
            let spawnChance = 0.3 + Math.min(0.4, tickCount * 0.002);
            if (Math.random() < spawnChance) {
                let lane = Math.floor(Math.random() * LANES);
                
                // Prevent spawning too close to another asteroid in the same lane
                let canSpawn = !asteroids.some(a => a.lane === lane && a.y < 150);
                
                if (canSpawn) {
                    let typeRoll = Math.random();
                    let type = 'ice';
                    let hp = 1;
                    
                    if (typeRoll > 0.85) {
                        type = 'metal';
                        hp = 999;
                    } else if (typeRoll > 0.5) {
                        type = 'stone';
                        hp = 2;
                    }

                    asteroids.push({
                        lane: lane,
                        y: -50,
                        drawY: -50,
                        type: type,
                        hp: hp,
                        maxHp: hp,
                        flashTick: 0
                    });
                }
            }

            // 4. Resolve Collisions
            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                if (l.y < -100) {
                    lasers.splice(i, 1);
                    continue;
                }

                // Check laser vs asteroid
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    let a = asteroids[j];
                    // Collision box mapping
                    if (l.lane === a.lane && l.y <= a.y + 30 && l.y >= a.y - 30) {
                        if (a.type !== 'metal') {
                            a.hp--;
                            a.flashTick = 5; // Visually flash for 5 frames
                        }
                        lasers.splice(i, 1); // Laser destroyed
                        
                        if (a.hp <= 0) {
                            asteroids.splice(j, 1);
                        }
                        break; // Move to next laser
                    }
                }
            }

            // Check asteroid vs player
            for (let a of asteroids) {
                if (a.lane === player.lane && a.y + 25 >= PLAYER_Y - 20 && a.y - 25 <= PLAYER_Y + 20) {
                    gameOver();
                    return false; // signals loop to stop
                }
            }

            // Cleanup off-screen asteroids
            asteroids = asteroids.filter(a => a.y < CANVAS_HEIGHT + 100);

            // Update State Viewer UI
            updateStateJSON();
            return true;
        }

        // --- AI Interactivity ---

        function updateStateJSON() {
            const state = {
                player_lane: player.lane,
                asteroids: []
            };

            for (let i = 0; i < LANES; i++) {
                // Find lowest asteroid in this lane that is still above or at player level
                const astsInLane = asteroids.filter(a => a.lane === i && a.y <= PLAYER_Y + 20);
                if (astsInLane.length > 0) {
                    astsInLane.sort((a, b) => b.y - a.y); // Sort descending by Y (closest to player first)
                    const closest = astsInLane[0];
                    state.asteroids.push({
                        lane: i,
                        type: closest.type,
                        distance: Math.floor(PLAYER_Y - closest.y)
                    });
                }
            }

            stateJsonEl.textContent = JSON.stringify(state, null, 2);
            return state;
        }

        function logAction(actor, action, colorClass) {
            const el = document.createElement('div');
            el.className = `flex gap-2 border-b border-slate-800 pb-1 ${colorClass}`;
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'text-slate-500 w-16 flex-shrink-0';
            timeSpan.innerText = `[T:${tickCount.toString().padStart(4, '0')}]`;
            
            const textSpan = document.createElement('span');
            textSpan.innerHTML = `<strong>${actor}:</strong> ${action}`;
            
            el.appendChild(timeSpan);
            el.appendChild(textSpan);
            
            actionLogEl.appendChild(el);
            actionLogEl.scrollTop = actionLogEl.scrollHeight;
            
            // Keep log from growing infinitely
            if (actionLogEl.childElementCount > 50) {
                actionLogEl.removeChild(actionLogEl.firstChild);
            }
        }

        // Heuristic Mock AI (Fallback)
        function getMockAIAction(stateObj) {
            const myLane = stateObj.player_lane;
            const threat = stateObj.asteroids.find(a => a.lane === myLane);
            
            // Immediate threat ahead
            if (threat && threat.distance < 350) {
                if (threat.type === 'metal') {
                    // Must dodge
                    let safeLanes = [0,1,2,3].filter(l => {
                        if (l === myLane) return false;
                        let a = stateObj.asteroids.find(ast => ast.lane === l);
                        return !a || a.distance > 300;
                    });
                    
                    if (safeLanes.length > 0) {
                        if (safeLanes.includes(myLane - 1)) return 'LEFT';
                        if (safeLanes.includes(myLane + 1)) return 'RIGHT';
                        return safeLanes[0] < myLane ? 'LEFT' : 'RIGHT';
                    }
                    return 'LEFT'; // Desperation move
                } else {
                    // Stone or Ice, we can shoot it
                    return 'SHOOT';
                }
            }

            // General pathfinding / centering logic if safe
            if (!threat || threat.distance > 500) {
               // Drift towards center if edge
               if (myLane === 0) return 'RIGHT';
               if (myLane === 3) return 'LEFT';
            }
            
            return 'IDLE';
        }

        // Async loop for AI mode
        async function runAILoop(currentGameId) {
            while (gameState === 'playing' && mode === 'ai' && currentGameId === gameId) {
                
                const stateObj = updateStateJSON();
                const stateStr = JSON.stringify(stateObj);
                
                let action = 'IDLE';
                let actor = 'Ollama';
                let color = 'text-emerald-400';

                const promptText = `You are playing a spaceship runner game.
Current state: ${stateStr}
Available actions: LEFT, RIGHT, SHOOT, IDLE.
Metal asteroids cannot be destroyed, you must dodge them.
Ice and Stone can be shot.
Reply with exactly ONE word: the action you choose. Do not explain.`;

                const modelName = document.getElementById('ollama-model').value || 'llama3.2';

                try {
                    const start = performance.now();
                    const res = await fetch('http://localhost:11434/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: modelName,
                            prompt: promptText,
                            stream: false
                        })
                    });
                    
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    
                    const data = await res.json();
                    const ms = Math.round(performance.now() - start);
                    
                    // Parse response defensively
                    let reply = (data.response || '').trim().toUpperCase();
                    // Just extract first valid command in case model is chatty
                    const validActions = ['LEFT', 'RIGHT', 'SHOOT', 'IDLE'];
                    let matched = false;
                    for (let va of validActions) {
                        if (reply.includes(va)) {
                            action = va;
                            matched = true;
                            break;
                        }
                    }
                    
                    if (!matched) action = 'IDLE';
                    
                    logAction(`Ollama (${ms}ms)`, action, color);
                    fallbackWarning.classList.add('hidden'); // Hide warning if success

                } catch (err) {
                    // CORS or Connection Failed -> Fallback to Mock AI
                    fallbackWarning.classList.remove('hidden');
                    fallbackWarning.classList.add('flex');
                    actor = 'Mock AI';
                    color = 'text-amber-400';
                    
                    action = getMockAIAction(stateObj);
                    
                    // Artificial delay to simulate thinking time so game is playable visually
                    await new Promise(resolve => setTimeout(resolve, 300));
                    logAction(actor, action, color);
                }

                // If game was stopped or mode changed while waiting for API, abort.
                if (gameState !== 'playing' || currentGameId !== gameId) break;

                // Advance game state with the chosen action
                executeLogic(action);
                tickCount++;
                tickCounterEl.innerText = `Tick: ${tickCount}`;
                score++;
            }
        }


        // --- Rendering Engine ---
        
        function drawPolygon(ctx, x, y, radius, sides, rotation) {
            ctx.beginPath();
            for (let i = 0; i < sides; i++) {
                const angle = rotation + (i * 2 * Math.PI) / sides;
                const px = x + radius * Math.cos(angle);
                const py = y + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function render(time) {
            // Smoothly interpolate visual positions towards logical positions
            // This makes the discrete logic steps look smooth on screen.
            const lerpFactor = 0.3;
            
            player.drawX += ((player.lane * LANE_WIDTH + LANE_WIDTH/2) - player.drawX) * lerpFactor;
            
            for (let a of asteroids) {
                if (a.drawY === undefined) a.drawY = a.y;
                a.drawY += (a.y - a.drawY) * lerpFactor;
            }
            for (let l of lasers) {
                if (l.drawY === undefined) l.drawY = l.y;
                l.drawY += (l.y - l.drawY) * lerpFactor;
            }

            // Clear Canvas
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Stars (Parallax background)
            ctx.fillStyle = '#ffffff';
            for (let star of stars) {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5; // Twinkle
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Move stars regardless of game state for continuous visual feedback
                star.y += star.speed;
                if (star.y > CANVAS_HEIGHT) {
                    star.y = 0;
                    star.x = Math.random() * CANVAS_WIDTH;
                }
            }
            ctx.globalAlpha = 1.0;

            // Draw Lanes
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            for (let i = 1; i < LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * LANE_WIDTH, 0);
                ctx.lineTo(i * LANE_WIDTH, CANVAS_HEIGHT);
                ctx.stroke();
            }

            // Draw Lasers
            ctx.strokeStyle = '#ef4444'; // Red laser
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            for (let l of lasers) {
                const lx = l.lane * LANE_WIDTH + LANE_WIDTH / 2;
                ctx.beginPath();
                ctx.moveTo(lx, l.drawY);
                ctx.lineTo(lx, l.drawY - 30);
                ctx.stroke();
                
                // Laser glow
                ctx.strokeStyle = '#fca5a5';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
            }

            // Draw Asteroids
            for (let a of asteroids) {
                const ax = a.lane * LANE_WIDTH + LANE_WIDTH / 2;
                
                // Flash effect if recently hit
                const isFlashing = a.flashTick > 0;
                if (a.flashTick > 0) a.flashTick--;

                if (a.type === 'ice') {
                    ctx.fillStyle = isFlashing ? '#ffffff' : '#06b6d4'; // Cyan
                    ctx.strokeStyle = '#cffafe';
                    ctx.lineWidth = 2;
                    drawPolygon(ctx, ax, a.drawY, 25, 4, time * 0.002); // Rotating diamond
                } else if (a.type === 'stone') {
                    ctx.fillStyle = isFlashing ? '#ffffff' : '#78350f'; // Brown
                    ctx.strokeStyle = '#d97706';
                    ctx.lineWidth = 3;
                    drawPolygon(ctx, ax, a.drawY, 30, 7, time * 0.001); // Jagged circle
                } else if (a.type === 'metal') {
                    ctx.fillStyle = '#475569'; // Grey
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 4;
                    drawPolygon(ctx, ax, a.drawY, 35, 6, 0); // Fixed Hexagon
                    // Inner rivet detail
                    ctx.fillStyle = '#1e293b';
                    drawPolygon(ctx, ax, a.drawY, 15, 6, 0);
                }
            }

            // Draw Player Ship
            ctx.save();
            ctx.translate(player.drawX, PLAYER_Y);
            
            // Engine exhaust
            const engineScale = (Math.sin(time * 0.02) + 1) * 0.5;
            ctx.fillStyle = '#fb923c';
            ctx.beginPath();
            ctx.moveTo(-10, 20);
            ctx.lineTo(10, 20);
            ctx.lineTo(0, 30 + engineScale * 15);
            ctx.fill();
            
            // Ship Hull
            ctx.fillStyle = '#cbd5e1'; // Silver body
            ctx.beginPath();
            ctx.moveTo(0, -25); // Nose
            ctx.lineTo(25, 20); // Right Wing
            ctx.lineTo(0, 10);  // Center indent
            ctx.lineTo(-25, 20); // Left Wing
            ctx.closePath();
            ctx.fill();
            
            // Cockpit
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.ellipse(0, -5, 6, 12, 0, 0, Math.PI*2);
            ctx.fill();
            
            ctx.restore();

            requestAnimationFrame(render);
        }

        // Initialize 
        initStars();
        requestAnimationFrame(render);

        // Pre-fill log
        logAction('System', 'Awaiting start command...', 'text-slate-400 italic');

    </script>
</body>
</html>
